services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      GREETING: ${GREETING}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    

    volumes:
      - pgdata: var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg-isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
